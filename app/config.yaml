pairs:
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD
  - NZDUSD
  - USDCAD
  - GBPJPY
  - EURAUD
  - XAUUSD
  - BTCUSD

intervals:
  M15: "15m"
  M5: "5m"

weights:
  M15: 0.7
  M5: 0.3

# MarketMilk-style strength settings (optional)
# strength_lookback_bars:
#   M15: 96   # ~1 day on 15m bars
#   M5: 288   # ~1 day on 5m bars
#
# gap_threshold: 2.0  # neutral band for the weighted strength-gap score

# Optional: trade only "extremes" (highest-strength currencies vs lowest-strength currencies)
# This reduces signals but can improve quality.
extremes_filter: true
extremes_top_n: 1   # base must be in top N and quote in bottom N (for BUY); reverse for SELL

ema_period:
  short: 5
  long: 20

s_r:
  lookback_bars: 200
  swing_window: 2

lot_size: 0.01  # Default micro lot; adjust based on your account

# Account / budget (used for informational risk display)
account_balance_usd: 104

# Risk:Reward settings (used for TP display/backtest defaults)
rr: 3.0

# Local time display for backtest sheets (fixed offset, no DST)
local_utc_offset_hours: -5

# Optional: override Yahoo Finance tickers per "pair".
# Yahoo does not reliably provide spot XAUUSD as XAUUSD=X; GC=F (Gold futures) is commonly available.
yfinance_symbols:
  XAUUSD: "GC=F"
  BTCUSD: "BTC-USD"

# Exclude non-FX instruments from currency strength aggregation.
# They can still be traded; their bias will be derived from the currency side (e.g., USD strength).
exclude_from_strength:
  - XAUUSD
  - BTCUSD

# Telegram display options
show_currency_strength: false   # hide the per-currency (AUD: M15..., etc) table
show_neutral_pairs: false       # hide pairs whose bias is NEUTRAL
